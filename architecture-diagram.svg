<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 12 12" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6b7a"/>
    </marker>
    <marker id="up" viewBox="0 0 12 12" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2733" flood-opacity="0.18"/>
    </filter>
    <style>
      .lbl{font-size:15px;font-weight:700;fill:#1a2733;}
      .sub{font-size:11px;font-weight:700;fill:#33404a;}
      .down{stroke:#5b6b7a;stroke-width:2;fill:none;}
      .up{stroke:#2e7d32;stroke-width:2;fill:none;stroke-dasharray:5,3;}
      .title{font-size:23px;font-weight:700;fill:#12212e;}
      .cap{font-size:13px;font-weight:600;fill:#4a5763;}
      .tag{font-size:11px;font-weight:700;fill:#fff;}
      .flowd{font-size:11px;font-weight:800;fill:#2b3640;}
      .flowu{font-size:11px;font-weight:800;fill:#186b1c;}
      .band{font-size:14px;font-weight:800;fill:#5b6b7a;letter-spacing:1px;}
    </style>
  </defs>

  <text x="520" y="38" text-anchor="middle" class="title">Bilingual Enterprise Agent &#8212; Architecture &amp; Round-Trip Flow</text>
  <text x="520" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5763">Agents for Business &#183; ADK multi-agent &#183; MCP servers &#183; Security guardrail &#183; Compliance Skill</text>
  <line x1="370" y1="80" x2="402" y2="80" class="down" marker-end="url(#down)"/>
  <text x="408" y="84" class="flowd">request flows down</text>
  <line x1="550" y1="80" x2="582" y2="80" class="up" marker-end="url(#up)"/>
  <text x="588" y="84" class="flowu">result flows back up</text>

  <rect x="20" y="96" width="1020" height="672" rx="16" fill="#f7f9fc"/>
  <!-- INTERACTION band -->
  <rect x="30" y="104" width="1000" height="146" rx="12" fill="#f4f7fb"/>

  <!-- thin separators between layers -->
  <rect x="38" y="106" width="128" height="22" rx="4" fill="#ffffff" opacity="0.8"/><text x="46" y="122" class="band">INTERACTION</text>
  <rect x="430" y="120" width="200" height="54" rx="10" fill="#eef3f8" stroke="#3d5a73" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="144" text-anchor="middle" class="lbl">User (Arabic / English)</text>
  <text x="530" y="162" text-anchor="middle" class="sub">one UI &#183; free-format language</text>

  <!-- User <-> Coordinator : wide gap, labels centered -->
  <text x="498" y="222" text-anchor="end" class="flowd">question</text>
  <text x="562" y="222" text-anchor="start" class="flowu">grounded answer</text>

  <!-- ORCHESTRATION band -->
  <rect x="30" y="250" width="1000" height="394" rx="12" fill="#eef6ef"/>
  <rect x="38" y="258" width="150" height="22" rx="4" fill="#ffffff" opacity="0.8"/><text x="46" y="274" class="band">ORCHESTRATION</text>

  <rect x="370" y="262" width="300" height="90" rx="10" fill="#d8ead8" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="292" text-anchor="middle" class="lbl">Coordinator (root_agent)</text>
  <text x="520" y="314" text-anchor="middle" class="sub">routes by tool name + description</text>
  <text x="520" y="334" text-anchor="middle" class="sub">GUARDRAIL: read-only &#183; injection-resistant &#183; cites sources</text>

  <!-- agents -->
  <rect x="70" y="486" width="250" height="78" rx="10" fill="#e3ecf7" stroke="#3d5a73" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="514" text-anchor="middle" class="lbl">docs_agent</text>
  <text x="195" y="534" text-anchor="middle" class="sub">policy / FAQ questions</text>
  <text x="195" y="550" text-anchor="middle" class="sub">(AgentTool)</text>

  <rect x="405" y="486" width="250" height="78" rx="10" fill="#e3ecf7" stroke="#3d5a73" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="514" text-anchor="middle" class="lbl">erp_agent</text>
  <text x="530" y="534" text-anchor="middle" class="sub">vendor / invoice / PO data</text>
  <text x="530" y="550" text-anchor="middle" class="sub">(AgentTool)</text>

  <rect x="740" y="486" width="250" height="78" rx="10" fill="#f7ecd8" stroke="#b8860b" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="510" text-anchor="middle" class="lbl">check_invoice_compliance</text>
  <text x="865" y="530" text-anchor="middle" class="sub">deterministic policy verdict</text>
  <text x="865" y="546" text-anchor="middle" class="sub">(Agent Skill &#183; POL-PROC-002)</text>

  <!-- coord <-> docs : elbow, wide gap -->
  <polyline points="450,352 450,420 195,420 195,486" class="down" marker-end="url(#down)"/>
  <text x="300" y="410" text-anchor="middle" class="flowd">routes call</text>
  <polyline points="240,486 240,436 480,436 480,353" class="up" marker-end="url(#up)"/>
  <text x="370" y="454" text-anchor="middle" class="flowu">answer + citation</text>

  <!-- coord <-> erp : straight -->
  <line x1="515" y1="352" x2="515" y2="486" class="down" marker-end="url(#down)"/>
  <line x1="555" y1="486" x2="555" y2="353" class="up" marker-end="url(#up)"/>

  <!-- coord <-> skill : elbow -->
  <polyline points="610,352 610,420 865,420 865,486" class="down" marker-end="url(#down)"/>
  <text x="748" y="410" text-anchor="middle" class="flowd">invoice args</text>
  <polyline points="820,486 820,436 580,436 580,353" class="up" marker-end="url(#up)"/>
  <text x="672" y="454" text-anchor="middle" class="flowu">verdict</text>

  <!-- DATA & RULES band : wide gap above server boxes -->
  <rect x="30" y="645" width="1000" height="130" rx="12" fill="#f5f3ef"/>
  <rect x="38" y="660" width="132" height="22" rx="4" fill="#ffffff" opacity="0.8"/><text x="46" y="676" class="band">DATA &amp; RULES</text>

  <rect x="70" y="690" width="250" height="56" rx="10" fill="#f0f0f0" stroke="#5b6b7a" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="714" text-anchor="middle" class="lbl">SharePoint MCP server</text>
  <text x="195" y="732" text-anchor="middle" class="sub">read-only &#183; MS Graph API</text>

  <rect x="405" y="690" width="250" height="56" rx="10" fill="#f0f0f0" stroke="#5b6b7a" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="714" text-anchor="middle" class="lbl">ERP MCP server</text>
  <text x="530" y="732" text-anchor="middle" class="sub">read-only &#183; D365 OData API</text>

  <rect x="740" y="690" width="250" height="56" rx="10" fill="#faf4e6" stroke="#b8860b" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="714" text-anchor="middle" class="lbl">check_invoice.py</text>
  <text x="865" y="732" text-anchor="middle" class="sub">unit-tested rule logic</text>

  <!-- agents <-> servers : labels centered in the 486->564 to 690 gap -->
  <line x1="175" y1="564" x2="175" y2="690" class="down" marker-end="url(#down)"/>
  <text x="168" y="630" text-anchor="end" class="flowd">query</text>
  <line x1="215" y1="690" x2="215" y2="564" class="up" marker-end="url(#up)"/>
  <text x="222" y="630" text-anchor="start" class="flowu">records</text>

  <line x1="510" y1="564" x2="510" y2="690" class="down" marker-end="url(#down)"/>
  <text x="503" y="630" text-anchor="end" class="flowd">query</text>
  <line x1="550" y1="690" x2="550" y2="564" class="up" marker-end="url(#up)"/>
  <text x="557" y="630" text-anchor="start" class="flowu">records</text>

  <line x1="845" y1="564" x2="845" y2="690" class="down" marker-end="url(#down)"/>
  <text x="838" y="630" text-anchor="end" class="flowd">call</text>
  <line x1="885" y1="690" x2="885" y2="564" class="up" marker-end="url(#up)"/>
  <text x="892" y="630" text-anchor="start" class="flowu">verdict</text>

  <!-- concepts key -->
  <text x="84" y="792" class="cap" font-weight="700">Course concepts demonstrated:</text>
  <rect x="290" y="778" width="122" height="20" rx="10" fill="#2e7d32"/><text x="351" y="792" text-anchor="middle" class="tag">Multi-agent (ADK)</text>
  <rect x="420" y="778" width="92" height="20" rx="10" fill="#3d5a73"/><text x="466" y="792" text-anchor="middle" class="tag">MCP servers</text>
  <rect x="520" y="778" width="78" height="20" rx="10" fill="#8a2f2f"/><text x="559" y="792" text-anchor="middle" class="tag">Security</text>
  <rect x="606" y="778" width="92" height="20" rx="10" fill="#b8860b"/><text x="652" y="792" text-anchor="middle" class="tag">Agent Skill</text>

  <!-- scenario strip -->
  <rect x="70" y="816" width="920" height="76" rx="10" fill="#ffffff" stroke="#cdd6df" filter="url(#shadow)"/>
  <text x="84" y="838" class="cap" font-weight="700">Demonstrated scenarios:</text>
  <text x="84" y="860" class="cap">1&#183; ERP total (25,450)   2&#183; return window (POL-RET-004)   3&#183; combined compliance (flags INV-1003)   4&#183; Skill verdict (VIOLATION)</text>
  <text x="84" y="878" class="cap">5&#183; injection resistance   6&#183; human-in-the-loop triage   7&#183; bilingual (Arabic query &#8594; Arabic answer)</text>
  <!-- separators drawn last so they sit on top of the band fills -->
  <rect x="30" y="250" width="1000" height="2" fill="#9aa8b4"/>
  <rect x="30" y="644" width="1000" height="2" fill="#9aa8b4"/>
  <!-- top User<->Coordinator arrows drawn last so they cross the separator and touch the box -->
  <line x1="505" y1="172" x2="505" y2="266" class="down" marker-end="url(#down)"/>
  <line x1="555" y1="266" x2="555" y2="172" class="up" marker-end="url(#up)"/>
</svg>
